# Tests of MAGMATOMIX/UMD on Linux, Windows and macOS : the C libraries compiled (src/compile_libraries.py), then the synthetic cases of the
# validation suite (validation/run_validation.py -c "syn_*" : runs written by validation/synthetic.py, compared with their exact answers ;
# no data needed). FAIL or CRASH fail the job ; CHANGED (last digits of some outputs, other platform) does not.
# On a published release, the compiled libraries of each system are attached to it (umd-c-libraries-<system>.zip), for the users without
# a compiler (Windows).

name: tests

on:
  push:
    branches: [master, windows-ci]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write                     # attach the compiled libraries to a release

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python packages
        run: python -m pip install numpy scipy matplotlib
      - name: Compiler
        run: gcc --version
      - name: C libraries
        run: python src/compile_libraries.py
      - name: Synthetic validation cases
        run: python validation/run_validation.py -c "syn_*" -o ci-runs
      - name: Keep the run folder when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.os }}
          path: |
            ci-runs/report.txt
            ci-runs/**/*.out
            ci-runs/**/*.log
          retention-days: 7
      - name: Attach the compiled libraries to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ runner.os }}" in
            Windows) name=windows ;;
            macOS) name=macos ;;
            *) name=linux ;;
          esac
          python -c "import zipfile,glob,os; z=zipfile.ZipFile('umd-c-libraries-$name.zip','w',zipfile.ZIP_DEFLATED); [z.write(f,os.path.basename(f)) for f in sorted(glob.glob('src/c_*.dll')+glob.glob('src/c_*.so')+glob.glob('src/c_*.dylib'))]; z.close()"
          gh release upload "${{ github.event.release.tag_name }}" "umd-c-libraries-$name.zip" --clobber
